services:
  db:
    image: postgres:16-alpine
    container_name: ips_kpi_db
    environment:
      POSTGRES_DB: ips_kpi
      POSTGRES_USER: ips_user
      POSTGRES_PASSWORD: ips_password_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ips_user -d ips_kpi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ips_network

  redis:
    image: redis:7-alpine
    container_name: ips_kpi_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ips_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ips_kpi_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://ips_user:ips_password_dev@db:5432/ips_kpi
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ips_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ips_kpi_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - ips_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  ips_network:
    driver: bridge
